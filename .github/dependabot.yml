version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"

  - package-ecosystem: nuget
    directory: /Infrastructure
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /API
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: nuget
    directory: /Core
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
