version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@schematics/angular"
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /Infrastructure
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /API
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # v11 targets ASP.NET Core 10/11; project is net8.0
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /Core
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-dependencies:
        patterns:
          - "*"
